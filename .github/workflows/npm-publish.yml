name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm 11.21.0
        run: npm install --global npm@11.21.0
      - run: pnpm install --frozen-lockfile
      - name: Build release package at tag version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [ -z "$version" ] || [ "$version" = "$RELEASE_TAG" ]; then
            echo "Release tag must start with v" >&2
            exit 1
          fi
          RELEASE_VERSION="$version" pnpm release:package
      - name: Build OIDC test package
        if: github.event_name == 'workflow_dispatch'
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: RELEASE_VERSION="0.2.2-oidc-test.${RUN_NUMBER}.${RUN_ATTEMPT}" pnpm release:package
      - run: pnpm release:smoke
      - name: Publish with npm trusted publishing
        if: github.event_name == 'release'
        working-directory: release/out/package
        run: npm publish --access public --provenance
      - name: Stage OIDC test version for review
        if: github.event_name == 'workflow_dispatch'
        working-directory: release/out/package
        run: npm stage publish
