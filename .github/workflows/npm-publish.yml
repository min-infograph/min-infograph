name: Publish npm packages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag (v<source version>)
        required: true
        type: string
      dry_run:
        description: Validate and dry-run only
        default: true
        type: boolean
        required: true
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_PRERELEASE: ${{ github.event_name == 'release' && toJSON(github.event.release.prerelease) || '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - run: node release/check-tag.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: npm install --global npm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:package
      - run: pnpm typecheck
      - run: pnpm release:policy-test
      - run: pnpm --filter @min-infograph/workbench exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm release:smoke
      - run: pnpm release:browser-smoke
      - name: Publish exact validated tarballs with npm trusted publishing
        run: node release/publish.mjs
      - name: Verify registry installs
        if: env.DRY_RUN == 'false'
        run: RELEASE_REGISTRY=true pnpm release:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-release-diagnostics
          path: |
            release/out/assets/
            apps/workbench/test-results/
            apps/workbench/playwright-report/
