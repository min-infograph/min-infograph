name: Attach release install assets
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build-and-attach:
    if: github.event.release.tag_name == 'v0.2.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm --filter @min-infograph/workbench exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm release:package
      - run: pnpm release:smoke
      - run: pnpm release:browser-smoke
      - name: Attach install assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/out/assets/* --clobber
