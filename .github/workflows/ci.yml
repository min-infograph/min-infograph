name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: npm install --global npm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:package
      - run: pnpm --filter @min-infograph/workbench exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm release:policy-test
      - run: pnpm release:smoke
      - run: pnpm release:browser-smoke
