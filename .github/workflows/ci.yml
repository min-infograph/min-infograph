name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @min-infograph/workbench exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm --filter @min-infograph/cli cli validate apps/workbench/src/examples/ai-agent.json
      - run: pnpm --filter @min-infograph/cli cli render apps/workbench/src/examples/ai-agent.json /tmp/agent.png
